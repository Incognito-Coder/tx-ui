{{define "balancerModal"}}
<a-modal
        :class="themeSwitcher.currentTheme"
        :closable="true"
        :confirm-loading="balancerModal.confirmLoading"
        :mask-closable="false"
        :ok-button-props="{ props: { disabled: !balancerModal.isValid } }"
        :ok-text="balancerModal.okText"
        :title="balancerModal.title"
        @ok="balancerModal.ok"
        cancel-text='{{ i18n "close" }}'
        id="balancer-modal"
        v-model="balancerModal.visible"
        wrap-class-name="panel-modal panel-modal-md">
    <a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
        <a-form-item :validate-status="balancerModal.duplicateTag? 'warning' : 'success'" has-feedback
                     label='{{ i18n "pages.xray.balancer.tag" }}'>
            <a-input @change="balancerModal.check()" @input="balancerModal.check()" placeholder='{{ i18n "pages.xray.balancer.tagDesc" }}'
                     v-model.trim="balancerModal.balancer.tag"></a-input>
        </a-form-item>
        <a-form-item label='{{ i18n "pages.xray.balancer.balancerStrategy" }}'>
            <a-select :dropdown-class-name="themeSwitcher.currentTheme" v-model="balancerModal.balancer.strategy">
                <a-select-option value="random">Random</a-select-option>
                <a-select-option value="roundRobin">Round Robin</a-select-option>
                <a-select-option value="leastLoad">Least Load</a-select-option>
                <a-select-option value="leastPing">Least Ping</a-select-option>
            </a-select>
        </a-form-item>
        <a-form-item :validate-status="balancerModal.emptySelector? 'warning' : 'success'" has-feedback
                     label='{{ i18n "pages.xray.balancer.balancerSelectors" }}'>
            <a-select :dropdown-class-name="themeSwitcher.currentTheme" @change="balancerModal.checkSelector()" mode="tags"
                      v-model="balancerModal.balancer.selector">
                <a-select-option :value="tag" v-for="tag in balancerModal.outboundTags">[[ tag ]]</a-select-option>
            </a-select>
        </a-form-item>
        <a-form-item label="Fallback">
            <a-select :dropdown-class-name="themeSwitcher.currentTheme" clearable
                      v-model="balancerModal.balancer.fallbackTag">
                <a-select-option :value="tag" v-for="tag in [ '', ...balancerModal.outboundTags]">[[ tag ]]
                </a-select-option>
            </a-select>
        </a-form-item>
    </a-form>
</a-modal>
<script>
    const balancerModal = {
        title: '',
        visible: false,
        confirmLoading: false,
        okText: '{{ i18n "sure" }}',
        isEdit: false,
        confirm: null,
        duplicateTag: false,
        emptySelector: false,
        isValid: true,
        balancer: {
            tag: '',
            strategy: 'random',
            selector: [],
            fallbackTag: ''
        },
        outboundTags: [],
        balancerTags: [],
        ok() {
            balancerModal.check();
            balancerModal.checkSelector();
            if (!balancerModal.isValid) return;
            if (!balancerModal.balancer || !balancerModal.balancer.selector || balancerModal.balancer.selector.length == 0) {
                balancerModal.emptySelector = true;
                return;
            }
            balancerModal.emptySelector = false;
            ObjectUtil.execute(balancerModal.confirm, balancerModal.balancer);
        },
        show({
                 title = '', okText = '{{ i18n "sure" }}', balancerTags = [], balancer = null, confirm = (balancer) => {
            }, isEdit = false
             }) {
            balancerModal.title = title;
            balancerModal.okText = okText;
            balancerModal.confirm = confirm;
            balancerModal.isEdit = isEdit;
            if (isEdit && balancer) {
                balancerModal.balancer = ObjectUtil.clone(balancer);
                if (!balancerModal.balancer.selector) {
                    balancerModal.balancer.selector = [];
                }
                if (!balancerModal.balancer.strategy) {
                    balancerModal.balancer.strategy = 'random';
                }
                if (typeof balancerModal.balancer.fallbackTag === 'undefined') {
                    balancerModal.balancer.fallbackTag = '';
                }
            } else {
                balancerModal.balancer = {
                    tag: '',
                    strategy: 'random',
                    selector: [],
                    fallbackTag: ''
                };
            }
            balancerModal.balancerTags = balancerTags.filter((tag) => tag != (balancer ? balancer.tag : ''));
            balancerModal.outboundTags = app.templateSettings && app.templateSettings.outbounds ? app.templateSettings.outbounds.filter((o) => !ObjectUtil.isEmpty(o.tag)).map(obj => obj.tag) : [];
            if (app.clientReverseTags) {
                balancerModal.outboundTags.push(...app.clientReverseTags);
            }
            balancerModal.check();
            balancerModal.checkSelector();
            balancerModal.visible = true;
        },
        close() {
            balancerModal.visible = false;
            balancerModal.loading(false);
        },
        loading(loading = true) {
            balancerModal.confirmLoading = loading;
        },
        check() {
            if (!balancerModal.balancer || !balancerModal.balancer.tag || balancerModal.balancer.tag.trim() === '' || balancerModal.balancerTags.includes(balancerModal.balancer.tag.trim())) {
                balancerModal.duplicateTag = true;
                balancerModal.isValid = false;
            } else {
                balancerModal.duplicateTag = false;
                balancerModal.isValid = true;
            }
        },
        checkSelector() {
            balancerModal.emptySelector = !balancerModal.balancer || !balancerModal.balancer.selector || balancerModal.balancer.selector.length == 0;
        }
    };

    new Vue({
        delimiters: ['[[', ']]'],
        el: '#balancer-modal',
        data: {
            balancerModal: balancerModal
        },
        methods: {}
    });

</script>
{{end}}
