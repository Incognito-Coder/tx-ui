{{define "fakednsModal"}}
<a-modal :class="themeSwitcher.currentTheme" :closable="true" :mask-closable="false" :ok-text="fakednsModal.okText"
         :title="fakednsModal.title" @ok="fakednsModal.ok"
         cancel-text='{{ i18n "close" }}' id="fakedns-modal" v-model="fakednsModal.visible"
         wrap-class-name="panel-modal panel-modal-md">
    <a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
        <a-form-item label='{{ i18n "pages.xray.fakedns.ipPool" }}'>
            <a-input v-model.trim="fakednsModal.fakeDns.ipPool"></a-input>
        </a-form-item>
        <a-form-item label='{{ i18n "pages.xray.fakedns.poolSize" }}'>
            <a-input-number :min="1" v-model.number="fakednsModal.fakeDns.poolSize"></a-input-number>
        </a-form-item>
    </a-form>
</a-modal>
<script>
    const fakednsModal = {
        title: '',
        visible: false,
        okText: '{{ i18n "confirm" }}',
        isEdit: false,
        confirm: null,
        fakeDns: {
            ipPool: "198.18.0.0/16",
            poolSize: 65535,
        },
        ok() {
            ObjectUtil.execute(fakednsModal.confirm, fakednsModal.fakeDns);
        },
        show({
                 title = '', okText = '{{ i18n "confirm" }}', fakeDns, confirm = (fakeDns) => {
            }, isEdit = false
             }) {
            this.title = title;
            this.okText = okText;
            this.confirm = confirm;
            this.visible = true;
            if (isEdit) {
                this.fakeDns = fakeDns;
            } else {
                this.fakeDns = {
                    ipPool: "198.18.0.0/16",
                    poolSize: 65535,
                }
            }
            this.isEdit = isEdit;
        },
        close() {
            fakednsModal.visible = false;
        },
    };

    new Vue({
        delimiters: ['[[', ']]'],
        el: '#fakedns-modal',
        data: {
            fakednsModal: fakednsModal,
        }
    });

</script>
{{end}}
