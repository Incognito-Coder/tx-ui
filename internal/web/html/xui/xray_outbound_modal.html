{{define "outModal"}}
<a-modal :class="themeSwitcher.currentTheme" :closable="true" :confirm-loading="outModal.confirmLoading" :mask-closable="false"
         :ok-button-props="{ props: { disabled: !outModal.isValid } }" :ok-text="outModal.okText" :title="outModal.title"
         @ok="outModal.ok" cancel-text='{{ i18n "close" }}'
         id="out-modal" style="overflow: hidden;" v-model="outModal.visible"
         wrap-class-name="panel-modal panel-modal-xl">
    {{template "form/outbound"}}
</a-modal>
<script>

    const outModal = {
        title: '',
        visible: false,
        confirmLoading: false,
        okText: '{{ i18n "sure" }}',
        isEdit: false,
        confirm: null,
        outbound: new Outbound(),
        jsonMode: false,
        link: '',
        cm: null,
        duplicateTag: false,
        isValid: true,
        activeKey: '1',
        tags: [],
        ok() {
            ObjectUtil.execute(outModal.confirm, outModal.outbound.toJson());
        },
        show({
                 title = '', okText = '{{ i18n "sure" }}', outbound, confirm = (outbound) => {
            }, isEdit = false, tags = []
             }) {
            this.title = title;
            this.okText = okText;
            this.confirm = confirm;
            this.jsonMode = false;
            this.link = '';
            this.activeKey = '1';
            this.visible = true;
            this.outbound = isEdit ? Outbound.fromJson(outbound) : new Outbound();
            this.isEdit = isEdit;
            this.tags = tags;
            outModal.check();
        },
        close() {
            outModal.visible = false;
            outModal.loading(false);
        },
        loading(loading = true) {
            outModal.confirmLoading = loading;
        },
        check() {
            if (outModal.outbound.tag == '' || outModal.tags.includes(outModal.outbound.tag)) {
                outModal.duplicateTag = true;
                outModal.isValid = false;
            } else {
                outModal.duplicateTag = false;
                outModal.isValid = true;
            }
        },
        toggleJson(jsonTab) {
            textAreaObj = document.getElementById('outboundJson');
            if (jsonTab) {
                if (this.cm != null) {
                    this.cm.toTextArea();
                    this.cm = null;
                }
                textAreaObj.value = JSON.stringify(this.outbound.toJson(), null, 2);
                this.cm = CodeMirror.fromTextArea(textAreaObj, app.cmOptions);
                this.cm.on('change', editor => {
                    value = editor.getValue();
                    if (this.isJsonString(value)) {
                        this.outbound = Outbound.fromJson(JSON.parse(value));
                        outModal.check();
                    }
                });
                this.activeKey = '2';
            } else {
                if (this.cm != null) {
                    this.cm.toTextArea();
                    this.cm = null;
                }
                this.activeKey = '1';
            }
        },
        isJsonString(str) {
            try {
                JSON.parse(str);
            } catch (e) {
                return false;
            }
            return true;
        },
    };

    new Vue({
        delimiters: ['[[', ']]'],
        el: '#out-modal',
        data: {
            outModal: outModal,
            get outbound() {
                return outModal.outbound;
            },
        },
        methods: {
            streamNetworkChange() {
                if (this.outModal.outbound.protocol == Protocols.VLESS && !outModal.outbound.canEnableTlsFlow()) {
                    delete this.outModal.outbound.settings.flow;
                }
            },
            canEnableTls() {
                return this.outModal.outbound.canEnableTls();
            },
            convertLink() {
                newOutbound = Outbound.fromLink(outModal.link);
                if (newOutbound) {
                    this.outModal.outbound = newOutbound;
                    this.outModal.toggleJson(true);
                    this.outModal.check();
                    this.$message.success('Outbound imported successfully...');
                    outModal.link = '';
                } else {
                    this.$message.error('Invalid Link or Config format!');
                    outModal.link = '';
                }
            },
            handleWgConfUpload(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const text = e.target.result;
                    if (!text || text.trim().length === 0) {
                        this.$message.error('The selected file is empty!');
                        return;
                    }
                    const newOutbound = Outbound.fromLink(text);
                    if (newOutbound) {
                        this.outModal.outbound = newOutbound;
                        this.outModal.toggleJson(true);
                        this.outModal.check();
                        this.$message.success('WireGuard configuration (.conf) imported successfully!');
                        outModal.link = '';
                    } else {
                        this.$message.error('Failed to parse WireGuard config file. Please check file format.');
                    }
                };
                reader.onerror = () => {
                    this.$message.error('Failed to read configuration file');
                };
                reader.readAsText(file);
                return false;
            },
        },
    });

</script>
{{end}}
