{{define "form/tun"}}
<a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
    <a-form-item>
        <template slot="label">
            <a-tooltip>
                <template slot="title">
                    <span>{{ i18n "pages.xray.tun.nameDesc" }}</span>
                </template>
                {{ i18n "pages.xray.tun.name" }}
                <a-icon type="question-circle"></a-icon>
            </a-tooltip>
        </template>
        <a-input placeholder="utunN (auto)" v-model.trim="inbound.settings.name"></a-input>
    </a-form-item>
    <a-form-item>
        <template slot="label">
            <a-tooltip>
                <template slot="title">
                    <span>{{ i18n "pages.xray.tun.descriptionDesc" }}</span>
                </template>
                {{ i18n "pages.xray.tun.adapterDescription" }}
                <a-icon type="question-circle"></a-icon>
            </a-tooltip>
        </template>
        <a-input placeholder="Wintun" v-model.trim="inbound.settings.desc"></a-input>
    </a-form-item>
    <a-form-item>
        <template slot="label">
            <a-tooltip>
                <template slot="title">
                    <span>{{ i18n "pages.xray.tun.mtuDesc" }}</span>
                </template>
                MTU
                <a-icon type="question-circle"></a-icon>
            </a-tooltip>
        </template>
        <a-input-number :max="9000" :min="1" placeholder="1500" v-model.number="inbound.settings.mtu"></a-input-number>
    </a-form-item>
    <a-form-item>
        <template slot="label">
            <a-tooltip>
                <template slot="title">
                    <span>{{ i18n "pages.xray.tun.userLevelDesc" }}</span>
                </template>
                {{ i18n "pages.xray.tun.userLevel" }}
                <a-icon type="question-circle"></a-icon>
            </a-tooltip>
        </template>
        <a-input-number :min="0" placeholder="0" v-model.number="inbound.settings.userLevel"></a-input-number>
    </a-form-item>
    <a-alert message='{{ i18n "pages.xray.tun.routeWarning" }}'
             show-icon style="margin-bottom: 16px" type="warning"></a-alert>
    <a-form-item label='{{ i18n "pages.xray.tun.gatewayPrefixes" }}'>
        <a-select :dropdown-class-name="themeSwitcher.currentTheme" :token-separators="[',']"
                  mode="tags" placeholder="169.254.10.1/30"
                  v-model="inbound.settings.gateway"></a-select>
    </a-form-item>
    <a-form-item label='{{ i18n "pages.xray.tun.dnsAddresses" }}'>
        <a-select :dropdown-class-name="themeSwitcher.currentTheme" :token-separators="[',']"
                  mode="tags" placeholder="1.1.1.1"
                  v-model="inbound.settings.dns"></a-select>
    </a-form-item>
    <a-form-item label='{{ i18n "pages.xray.tun.systemRoutes" }}'>
        <a-select :dropdown-class-name="themeSwitcher.currentTheme" :token-separators="[',']"
                  mode="tags" placeholder="0.0.0.0/0"
                  v-model="inbound.settings.autoSystemRoutingTable"></a-select>
    </a-form-item>
    <a-form-item>
        <template slot="label">
            <a-tooltip>
                <template slot="title">
                    <span>{{ i18n "pages.xray.tun.outboundInterfaceDesc" }}</span>
                </template>
                {{ i18n "pages.xray.tun.outboundInterface" }}
                <a-icon type="question-circle"></a-icon>
            </a-tooltip>
        </template>
        <a-input placeholder="auto" v-model.trim="inbound.settings.autoOutboundsInterface"></a-input>
    </a-form-item>
</a-form>
{{end}}
