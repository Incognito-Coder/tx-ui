{{define "form/wireguard"}}
<a-collapse activeKey="0" v-for="(client, index) in inbound.settings.peers.slice(0,1)" v-if="!isEdit">
  <a-collapse-panel header='{{ i18n "pages.inbounds.client" }}'>
    {{template "form/client"}}
  </a-collapse-panel>
</a-collapse>
<a-collapse v-else>
  <a-collapse-panel :header="'{{ i18n "pages.client.clientCount"}} : ' + inbound.settings.peers.length">
    <table width="100%">
      <tr class="client-table-header">
        <th>{{ i18n "pages.inbounds.email" }}</th>
        <th>Public Key</th>
      </tr>
      <tr v-for="(client, index) in inbound.settings.peers" :class="index % 2 == 1 ? 'client-table-odd-row' : ''">
        <td>[[ client.email ]]</td>
        <td>[[ client.publicKey ]]</td>
      </tr>
    </table>
  </a-collapse-panel>
</a-collapse>
<a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
    <a-form-item>
        <template slot="label">
            <a-tooltip>
                <template slot="title">
                    <span>{{ i18n "reset" }}</span>
                </template>
                {{ i18n "pages.xray.wireguard.secretKey" }}
                <a-icon type="sync"
                        @click="[inbound.settings.pubKey, inbound.settings.secretKey] = Object.values(Wireguard.generateKeypair())"></a-icon>
            </a-tooltip>
        </template>
        <a-input v-model.trim="inbound.settings.secretKey"></a-input>
    </a-form-item>
    <a-form-item label='{{ i18n "pages.xray.wireguard.publicKey" }}'>
        <a-input disabled v-model="inbound.settings.pubKey"></a-input>
    </a-form-item>
    <a-form-item label='{{ i18n "pages.xray.wireguard.interfaceAddresses" }}'>
        <a-select :dropdown-class-name="themeSwitcher.currentTheme" :token-separators="[',']"
                  mode="tags" placeholder="10.0.0.1/24"
                  v-model="inbound.settings.address"></a-select>
    </a-form-item>
    <a-form-item label='MTU'>
        <a-input-number v-model.number="inbound.settings.mtu"></a-input-number>
    </a-form-item>
    <a-form-item label='No Kernel Tun'>
        <a-switch v-model="inbound.settings.noKernelTun"></a-switch>
    </a-form-item>
</a-form>
{{end}}
