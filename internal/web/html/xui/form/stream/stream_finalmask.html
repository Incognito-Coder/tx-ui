{{define "form/streamFinalMask"}}
<a-divider :style="{ margin: '5px 0 0' }"></a-divider>
<a-form :colon="false" :label-col="{ md: {span:8} }"
        :wrapper-col="{ md: {span:14} }">
    <a-form-item label='{{ i18n "pages.xray.finalmask.tcpMasks" }}' v-if="inbound.stream.network !== 'kcp'">
        <a-button @click="inbound.stream.addTcpMask('xmc')" icon="plus" size="small"
                  type="primary"></a-button>
    </a-form-item>
    <template v-if="inbound.stream.network !== 'kcp' && inbound.stream.finalmask.tcp && inbound.stream.finalmask.tcp.length > 0">
        <a-form :colon="false" :key="tcpIndex" :label-col="{ md: {span:8} }"
                :wrapper-col="{ md: {span:14} }" v-for="(mask, tcpIndex) in inbound.stream.finalmask.tcp">
            <a-divider :style="{ margin: '0' }">{{ i18n "pages.xray.finalmask.tcpMask" }} [[ tcpIndex + 1 ]]
                <a-icon :style="{ color: 'rgb(255, 77, 79)', cursor: 'pointer' }"
                        @click="() => inbound.stream.delTcpMask(tcpIndex)" type="delete"></a-icon>
            </a-divider>
            <a-form-item label='{{ i18n "pages.xray.finalmask.type" }}'>
                <a-select :dropdown-class-name="themeSwitcher.currentTheme"
                          @change="(type) => { mask.settings = mask._getDefaultSettings ? mask._getDefaultSettings(type, {}) : {}; }"
                          v-model="mask.type">
                    <a-select-option value="xmc">XMC (Minecraft)</a-select-option>
                    <a-select-option value="sudoku">Sudoku</a-select-option>
                    <a-select-option value="fragment">Fragment</a-select-option>
                    <a-select-option value="header-custom">Header Custom</a-select-option>
                </a-select>
            </a-form-item>
            <template v-if="mask.type === 'xmc'">
                <a-form-item label='{{ i18n "pages.xray.finalmask.hostname" }}'>
                    <a-input placeholder='{{ i18n "pages.xray.finalmask.hostnamePlaceholder" }}' v-model.trim="mask.settings.hostname"></a-input>
                </a-form-item>
                <a-form-item label='{{ i18n "password" }}' required>
                    <a-input placeholder='{{ i18n "pages.xray.finalmask.passwordPlaceholder" }}' type="password"
                             v-model.trim="mask.settings.password"></a-input>
                </a-form-item>
                <a-form-item label='{{ i18n "pages.xray.finalmask.signedProfiles" }}'>
                    <a-button @click="mask.addProfile()" icon="plus" size="small"></a-button>
                </a-form-item>
                <a-form :colon="false" :key="tcpIndex + '-' + profileIndex"
                        :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }"
                        v-for="(profile, profileIndex) in mask.settings.profiles">
                    <a-divider :style="{ margin: '0' }">{{ i18n "pages.xray.finalmask.profile" }} [[ profileIndex + 1 ]]
                        <a-icon :style="{ color: 'rgb(255, 77, 79)', cursor: 'pointer' }"
                                @click="() => mask.delProfile(profileIndex)" type="delete"></a-icon>
                    </a-divider>
                    <a-form-item label='{{ i18n "username" }}' required>
                        <a-input placeholder='{{ i18n "pages.xray.finalmask.usernamePlaceholder" }}'
                                 v-model.trim="profile.username"></a-input>
                    </a-form-item>
                    <a-form-item label='{{ i18n "pages.xray.finalmask.uuid" }}' required>
                        <a-input v-model.trim="profile.uuid"></a-input>
                    </a-form-item>
                    <a-form-item label='{{ i18n "pages.xray.finalmask.texturesValue" }}' required>
                        <a-textarea :auto-size="{ minRows: 2, maxRows: 5 }"
                                    v-model.trim="profile.texturesValue"></a-textarea>
                    </a-form-item>
                    <a-form-item label='{{ i18n "pages.xray.finalmask.texturesSignature" }}' required>
                        <a-textarea :auto-size="{ minRows: 2, maxRows: 5 }"
                                    v-model.trim="profile.texturesSignature"></a-textarea>
                    </a-form-item>
                </a-form>
            </template>
            <template v-if="mask.type === 'fragment'">
                <a-form-item label='{{ i18n "pages.xray.finalmask.length" }}'>
                    <a-input placeholder="e.g. 10-20" v-model.trim="mask.settings.length"></a-input>
                </a-form-item>
                <a-form-item label='{{ i18n "pages.xray.finalmask.interval" }}'>
                    <a-input placeholder="e.g. 10-20" v-model.trim="mask.settings.interval"></a-input>
                </a-form-item>
            </template>
            <template v-if="mask.type === 'sudoku'">
                <a-form-item label='{{ i18n "pages.xray.finalmask.asciiTable" }}'>
                    <a-input placeholder="ASCII Mapping string" v-model.trim="mask.settings.ascii"></a-input>
                </a-form-item>
                <a-form-item label='{{ i18n "pages.xray.finalmask.paddingMin" }}'>
                    <a-input-number :min="0" v-model.number="mask.settings.paddingMin"></a-input-number>
                </a-form-item>
                <a-form-item label='{{ i18n "pages.xray.finalmask.paddingMax" }}'>
                    <a-input-number :min="0" v-model.number="mask.settings.paddingMax"></a-input-number>
                </a-form-item>
            </template>
            <template v-if="mask.type === 'header-custom'">
                <a-form-item label='{{ i18n "pages.xray.finalmask.randRange" }}'>
                    <a-input placeholder="e.g. 100-200" v-model.trim="mask.settings.randRange"></a-input>
                </a-form-item>
            </template>
        </a-form>
    </template>
    <a-form-item label='{{ i18n "pages.xray.finalmask.udpMasks" }}'>
        <a-button @click="inbound.stream.addUdpMask(inbound.stream.network === 'kcp' ? 'mkcp-aes128gcm' : 'salamander')" icon="plus" size="small"
                  type="primary"></a-button>
    </a-form-item>
    <template
            v-if="inbound.stream.finalmask.udp && inbound.stream.finalmask.udp.length > 0">
        <a-form :colon="false"
                :key="index" :label-col="{ md: {span:8} }"
                :wrapper-col="{ md: {span:14} }" v-for="(mask, index) in inbound.stream.finalmask.udp">
            <a-divider :style="{ margin: '0' }">{{ i18n "pages.xray.finalmask.udpMask" }} [[ index + 1 ]]
                <a-icon :style="{ color: 'rgb(255, 77, 79)', cursor: 'pointer' }"
                        @click="() => inbound.stream.delUdpMask(index)"
                        type="delete"></a-icon>
            </a-divider>
            <a-form-item label='{{ i18n "pages.xray.finalmask.type" }}'>
                <a-select :dropdown-class-name="themeSwitcher.currentTheme"
                          @change="(type) => { mask.settings = mask._getDefaultSettings ? mask._getDefaultSettings(type, {}) : {}; if(inbound.stream.network === 'kcp') { inbound.stream.kcp.mtu = type === 'xdns' ? 900 : 1350; } }"
                          v-model="mask.type">
                    <a-select-option value="salamander">Salamander</a-select-option>
                    <a-select-option value="sudoku">Sudoku</a-select-option>
                    <a-select-option value="noise">Noise</a-select-option>
                    <a-select-option value="header-custom">Header Custom</a-select-option>
                    <a-select-option value="udpHop">udpHop</a-select-option>
                    <!-- mKCP-specific masks -->
                    <a-select-option v-if="inbound.stream.network === 'kcp'"
                                     value="mkcp-aes128gcm">
                        mKCP AES-128-GCM
                    </a-select-option>
                    <a-select-option v-if="inbound.stream.network === 'kcp'"
                                     value="header-dns">
                        Header DNS
                    </a-select-option>
                    <a-select-option v-if="inbound.stream.network === 'kcp'"
                                     value="header-dtls">
                        Header DTLS 1.2
                    </a-select-option>
                    <a-select-option v-if="inbound.stream.network === 'kcp'"
                                     value="header-srtp">
                        Header SRTP
                    </a-select-option>
                    <a-select-option v-if="inbound.stream.network === 'kcp'"
                                     value="header-utp">
                        Header uTP
                    </a-select-option>
                    <a-select-option v-if="inbound.stream.network === 'kcp'"
                                     value="header-wechat">
                        Header WeChat Video
                    </a-select-option>
                    <a-select-option v-if="inbound.stream.network === 'kcp'"
                                     value="header-wireguard">
                        Header WireGuard
                    </a-select-option>
                    <a-select-option v-if="inbound.stream.network === 'kcp'"
                                     value="mkcp-original">
                        mKCP Original
                    </a-select-option>
                    <a-select-option v-if="inbound.stream.network === 'kcp'"
                                     value="xicmp">
                        xICMP (Experimental)
                    </a-select-option>
                    <!-- xDNS for TCP/WS/HTTPUpgrade/XHTTP/KCP -->
                    <a-select-option
                            v-if="['tcp', 'ws', 'httpupgrade', 'xhttp', 'kcp'].includes(inbound.stream.network)"
                            value="xdns">
                        xDNS (Experimental)
                    </a-select-option>
                </a-select>
            </a-form-item>
            <!-- Settings for password-based masks -->
            <a-form-item label='{{ i18n "password" }}'
                         v-if="['salamander', 'mkcp-aes128gcm'].includes(mask.type)">
                <a-input placeholder="Obfuscation password"
                         v-model.trim="mask.settings.password"></a-input>
            </a-form-item>
            <!-- Settings for domain-based masks -->
            <a-form-item label="Domain" v-if="mask.type === 'header-dns'">
                <a-input placeholder="e.g., www.example.com" v-model.trim="mask.settings.domain"></a-input>
            </a-form-item>
            <template v-if="mask.type === 'xdns'">
                <a-form-item label="Domains">
                    <a-select
                            mode="tags"
                            v-model="mask.settings.domains"
                            :style="{ width: '100%' }"
                            :token-separators="[',']"
                            placeholder="e.g., www.example.com"
                    ></a-select>
                </a-form-item>
            </template>
            <!-- Settings for Sudoku -->
            <template v-if="mask.type === 'sudoku'">
                <a-form-item label='{{ i18n "pages.xray.finalmask.asciiTable" }}'>
                    <a-input placeholder="ASCII Mapping string" v-model.trim="mask.settings.ascii"></a-input>
                </a-form-item>
                <a-form-item label='{{ i18n "pages.xray.finalmask.paddingMin" }}'>
                    <a-input-number :min="0" v-model.number="mask.settings.paddingMin"></a-input-number>
                </a-form-item>
                <a-form-item label='{{ i18n "pages.xray.finalmask.paddingMax" }}'>
                    <a-input-number :min="0" v-model.number="mask.settings.paddingMax"></a-input-number>
                </a-form-item>
            </template>
            <!-- Settings for Noise / Header-Custom -->
            <template v-if="['noise', 'header-custom'].includes(mask.type)">
                <a-form-item label='{{ i18n "pages.xray.finalmask.randRange" }}'>
                    <a-input placeholder="e.g. 100-200" v-model.trim="mask.settings.randRange"></a-input>
                </a-form-item>
            </template>
            <!-- Settings for udpHop -->
            <template v-if="mask.type === 'udpHop'">
                <a-form-item label="Ports">
                    <a-input placeholder="e.g. 10000-20000,30000" v-model.trim="mask.settings.ports"></a-input>
                </a-form-item>
                <a-form-item label='{{ i18n "pages.xray.finalmask.interval" }}'>
                    <a-input placeholder="e.g. 10-30" v-model.trim="mask.settings.interval"></a-input>
                </a-form-item>
            </template>
            <!-- Settings for xICMP -->
            <a-form-item label='IP'
                         v-if="mask.type === 'xicmp'">
                <a-input placeholder="e.g., 1.1.1.1"
                         v-model.trim="mask.settings.ip"></a-input>
            </a-form-item>
            <a-form-item label='ID'
                         v-if="mask.type === 'xicmp'">
                <a-input-number :max="65535"
                                :min="0" v-model.number="mask.settings.id"></a-input-number>
            </a-form-item>
        </a-form>
    </template>
</a-form>
{{end}}
