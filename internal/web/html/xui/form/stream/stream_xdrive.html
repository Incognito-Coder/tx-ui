{{define "form/streamXDrive"}}
<a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
    <a-form-item label='{{ i18n "pages.xray.xdrive.service" }}'>
        <a-select :dropdown-class-name="themeSwitcher.currentTheme" v-model="inbound.stream.xdrive.service">
            <a-select-option value="local">local</a-select-option>
            <a-select-option value="Google Drive">Google Drive</a-select-option>
            <a-select-option value="template">template</a-select-option>
        </a-select>
    </a-form-item>
    <a-form-item label='{{ i18n "pages.xray.xdrive.remoteFolder" }}'>
        <a-input placeholder="xray_drive_folder" v-model.trim="inbound.stream.xdrive.remoteFolder"></a-input>
    </a-form-item>
    <a-form-item v-if="inbound.stream.xdrive.service === 'Google Drive'">
        <template slot="label">
            <a-tooltip>
                <template slot="title">
                    <span>{{ i18n "pages.xray.xdrive.secretsDesc" }}</span>
                </template>
                {{ i18n "pages.xray.xdrive.secrets" }}
                <a-icon type="question-circle"></a-icon>
            </a-tooltip>
        </template>
        <a-textarea :rows="3" placeholder="ClientID&#10;ClientSecret&#10;RefreshToken" v-model="inbound.stream.xdrive.secrets"></a-textarea>
    </a-form-item>
    <a-form-item label='{{ i18n "pages.xray.xdrive.template" }}' v-if="inbound.stream.xdrive.service === 'template'">
        <a-textarea :rows="4" placeholder="{ ... }" v-model="inbound.stream.xdrive.template"></a-textarea>
    </a-form-item>
    <a-form-item label='{{ i18n "pages.xray.xdrive.segmentBytes" }}'>
        <a-input-number :min="1024" placeholder="1048576" v-model.number="inbound.stream.xdrive.segmentBytes"></a-input-number>
    </a-form-item>
    <a-form-item label='{{ i18n "pages.xray.xdrive.flushIntervalMs" }}'>
        <a-input-number :min="1" placeholder="500" v-model.number="inbound.stream.xdrive.flushIntervalMs"></a-input-number>
    </a-form-item>
    <a-form-item label='{{ i18n "pages.xray.xdrive.pollIntervalMs" }}'>
        <a-input-number :min="1" placeholder="500" v-model.number="inbound.stream.xdrive.pollIntervalMs"></a-input-number>
    </a-form-item>
    <a-form-item label='{{ i18n "pages.xray.xdrive.maxPollIntervalMs" }}'>
        <a-input-number :min="1" placeholder="5000" v-model.number="inbound.stream.xdrive.maxPollIntervalMs"></a-input-number>
    </a-form-item>
    <a-form-item label='{{ i18n "pages.xray.xdrive.sessionTtlSeconds" }}'>
        <a-input-number :min="1" placeholder="60" v-model.number="inbound.stream.xdrive.sessionTtlSeconds"></a-input-number>
    </a-form-item>
    <a-form-item label='{{ i18n "pages.xray.xdrive.concurrency" }}'>
        <a-input-number :min="1" placeholder="4" v-model.number="inbound.stream.xdrive.concurrency"></a-input-number>
    </a-form-item>
</a-form>
{{end}}
