name: Release TX-UI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            os: ubuntu-22.04
          - platform: linux-arm64
            os: ubuntu-22.04
          - platform: linux-armv7
            os: ubuntu-22.04
          - platform: linux-armv6
            os: ubuntu-22.04
          - platform: linux-386
            os: ubuntu-22.04
          - platform: linux-armv5
            os: ubuntu-22.04
          - platform: linux-s390x
            os: ubuntu-22.04
          - platform: windows-amd64
            os: windows-latest
          - platform: windows-386
            os: windows-latest
          - platform: windows-arm64
            os: windows-latest
          - platform: darwin-amd64
            os: macos-latest
          - platform: darwin-arm64
            os: macos-latest
          - platform: linux-riscv64
            os: ubuntu-22.04
          - platform: linux-mips
            os: ubuntu-22.04
          - platform: linux-mipsle
            os: ubuntu-22.04
          - platform: linux-mips64
            os: ubuntu-22.04
          - platform: linux-mips64le
            os: ubuntu-22.04
          - platform: linux-ppc64le
            os: ubuntu-22.04
          - platform: linux-loong64
            os: ubuntu-22.04
          - platform: freebsd-amd64
            os: ubuntu-22.04
          - platform: freebsd-arm64
            os: ubuntu-22.04
          - platform: freebsd-386
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          PLATFORM="${{ matrix.platform }}"
          MUSL_TRIPLE=""
          MUSL_CC_ARCHIVE=""
          case "$PLATFORM" in
            linux-amd64)    MUSL_TRIPLE="x86_64-unknown-linux-musl" ;;
            linux-arm64)    MUSL_TRIPLE="aarch64-unknown-linux-musl" ;;
            linux-armv7)    MUSL_TRIPLE="armv7-unknown-linux-musleabihf" ;;
            linux-armv6)    MUSL_TRIPLE="arm-unknown-linux-musleabihf" ;;
            linux-armv5)    MUSL_TRIPLE="arm-unknown-linux-musleabi" ;;
            linux-386)      MUSL_TRIPLE="i686-unknown-linux-musl" ;;
            linux-s390x)    MUSL_TRIPLE="s390x-ibm-linux-musl" ;;
            linux-riscv64)  MUSL_TRIPLE="riscv64-unknown-linux-musl" ;;
            linux-mips)     MUSL_TRIPLE="mips-unknown-linux-muslsf"; MUSL_CC_ARCHIVE="mips-linux-muslsf-cross.tgz" ;;
            linux-mipsle)   MUSL_TRIPLE="mipsel-unknown-linux-muslsf"; MUSL_CC_ARCHIVE="mipsel-linux-muslsf-cross.tgz" ;;
            linux-mips64)   MUSL_TRIPLE="mips64-unknown-linux-musl"; MUSL_CC_ARCHIVE="mips64-linux-musl-cross.tgz" ;;
            linux-mips64le) MUSL_TRIPLE="mips64el-unknown-linux-musl"; MUSL_CC_ARCHIVE="mips64el-linux-musl-cross.tgz" ;;
            linux-ppc64le)  MUSL_TRIPLE="powerpc64le-unknown-linux-musl" ;;
            linux-loong64)  MUSL_TRIPLE="loongarch64-unknown-linux-musl" ;;
          esac

          if [ -n "$MUSL_TRIPLE" ]; then
            if ! command -v xz >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y xz-utils
            fi
            sudo mkdir -p /opt/x-tools
            if curl -fsSL --retry 3 --retry-delay 3 \
                "https://github.com/cross-tools/musl-cross/releases/latest/download/${MUSL_TRIPLE}.tar.xz" \
                -o /tmp/musl-cross.tar.xz; then
              sudo tar -xf /tmp/musl-cross.tar.xz -C /opt/x-tools
              rm -f /tmp/musl-cross.tar.xz
            elif [ -n "$MUSL_CC_ARCHIVE" ] && curl -fsSL --retry 3 --retry-delay 3 \
                "https://musl.cc/${MUSL_CC_ARCHIVE}" \
                -o /tmp/musl-cc.tgz; then
              sudo tar -xzf /tmp/musl-cc.tgz -C /opt/x-tools
              rm -f /tmp/musl-cc.tgz
            else
              echo "::warning::Failed to download musl toolchain for ${PLATFORM}; non-MIPS targets will fall back to CGO_ENABLED=0."
            fi
          fi

      - name: Build x-ui (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          export CGO_ENABLED=1
          LDFLAGS="-w -s"
          if [ "${{ runner.os }}" == "macOS" ]; then
            if [ "${{ matrix.platform }}" == "darwin-amd64" ]; then
              export GOOS=darwin
              export GOARCH=amd64
            elif [ "${{ matrix.platform }}" == "darwin-arm64" ]; then
              export GOOS=darwin
              export GOARCH=arm64
            fi
          elif [[ "${{ matrix.platform }}" == freebsd-* ]]; then
            export GOOS=freebsd
            export CGO_ENABLED=0
            if [ "${{ matrix.platform }}" == "freebsd-amd64" ]; then
              export GOARCH=amd64
            elif [ "${{ matrix.platform }}" == "freebsd-arm64" ]; then
              export GOARCH=arm64
            elif [ "${{ matrix.platform }}" == "freebsd-386" ]; then
              export GOARCH=386
            fi
          else
            export GOOS=linux
            MUSL_TRIPLE=""
            MUSL_CC_ALT=""
            case "${{ matrix.platform }}" in
              linux-amd64)
                export GOARCH=amd64
                MUSL_TRIPLE="x86_64-unknown-linux-musl"
                ;;
              linux-arm64)
                export GOARCH=arm64
                MUSL_TRIPLE="aarch64-unknown-linux-musl"
                ;;
              linux-armv7)
                export GOARCH=arm
                export GOARM=7
                MUSL_TRIPLE="armv7-unknown-linux-musleabihf"
                ;;
              linux-armv6)
                export GOARCH=arm
                export GOARM=6
                MUSL_TRIPLE="arm-unknown-linux-musleabihf"
                ;;
              linux-armv5)
                export GOARCH=arm
                export GOARM=5
                MUSL_TRIPLE="arm-unknown-linux-musleabi"
                ;;
              linux-386)
                export GOARCH=386
                MUSL_TRIPLE="i686-unknown-linux-musl"
                ;;
              linux-s390x)
                export GOARCH=s390x
                MUSL_TRIPLE="s390x-ibm-linux-musl"
                ;;
              linux-riscv64)
                export GOARCH=riscv64
                MUSL_TRIPLE="riscv64-unknown-linux-musl"
                ;;
              linux-mips)
                export GOARCH=mips
                export GOMIPS=softfloat
                MUSL_TRIPLE="mips-unknown-linux-muslsf"
                MUSL_CC_ALT="mips-linux-muslsf"
                ;;
              linux-mipsle)
                export GOARCH=mipsle
                export GOMIPS=softfloat
                MUSL_TRIPLE="mipsel-unknown-linux-muslsf"
                MUSL_CC_ALT="mipsel-linux-muslsf"
                ;;
              linux-mips64)
                export GOARCH=mips64
                MUSL_TRIPLE="mips64-unknown-linux-musl"
                MUSL_CC_ALT="mips64-linux-musl"
                ;;
              linux-mips64le)
                export GOARCH=mips64le
                MUSL_TRIPLE="mips64el-unknown-linux-musl"
                MUSL_CC_ALT="mips64el-linux-musl"
                ;;
              linux-ppc64le)
                export GOARCH=ppc64le
                MUSL_TRIPLE="powerpc64le-unknown-linux-musl"
                ;;
              linux-loong64)
                export GOARCH=loong64
                MUSL_TRIPLE="loongarch64-unknown-linux-musl"
                ;;
            esac

            MUSL_GCC=""
            if [ -n "$MUSL_TRIPLE" ] && [ -x "/opt/x-tools/${MUSL_TRIPLE}/bin/${MUSL_TRIPLE}-gcc" ]; then
              MUSL_GCC="/opt/x-tools/${MUSL_TRIPLE}/bin/${MUSL_TRIPLE}-gcc"
            elif [ -n "$MUSL_CC_ALT" ] && [ -x "/opt/x-tools/${MUSL_CC_ALT}-cross/bin/${MUSL_CC_ALT}-gcc" ]; then
              MUSL_GCC="/opt/x-tools/${MUSL_CC_ALT}-cross/bin/${MUSL_CC_ALT}-gcc"
            fi

            if [ -n "$MUSL_GCC" ]; then
              export CC="$MUSL_GCC"
              export CGO_ENABLED=1
              export CGO_CFLAGS="-D_LARGEFILE64_SOURCE"
              LDFLAGS="-w -s -linkmode external -extldflags '-static'"
            else
              # Pure-Go SQLite static build works cleanly on musl/OpenWrt & Linux (except 32/64-bit MIPS)
              export CGO_ENABLED=0
            fi
          fi

          go build -mod=readonly -ldflags "${LDFLAGS}" -o xui-release -v main.go
          file xui-release || true

          mkdir x-ui
          cp xui-release x-ui/
          cp x-ui.service x-ui/ 2>/dev/null || true
          cp x-ui.init x-ui/ 2>/dev/null || true
          cp x-ui.sh x-ui/ 2>/dev/null || true
          mv x-ui/xui-release x-ui/x-ui
          chmod +x x-ui/x-ui x-ui/x-ui.sh x-ui/x-ui.init 2>/dev/null || true
          mkdir -p x-ui/bin
          cd x-ui/bin

          # Download dependencies
          Xray_URL="https://github.com/XTLS/Xray-core/releases/download/v26.11.9/"
          if [ "${{ matrix.platform }}" == "linux-amd64" ]; then
            curl -sSL -O ${Xray_URL}Xray-linux-64.zip && unzip -q Xray-linux-64.zip && rm -f Xray-linux-64.zip
          elif [ "${{ matrix.platform }}" == "linux-arm64" ]; then
            curl -sSL -O ${Xray_URL}Xray-linux-arm64-v8a.zip && unzip -q Xray-linux-arm64-v8a.zip && rm -f Xray-linux-arm64-v8a.zip
          elif [ "${{ matrix.platform }}" == "linux-armv7" ]; then
            curl -sSL -O ${Xray_URL}Xray-linux-arm32-v7a.zip && unzip -q Xray-linux-arm32-v7a.zip && rm -f Xray-linux-arm32-v7a.zip
          elif [ "${{ matrix.platform }}" == "linux-armv6" ]; then
            curl -sSL -O ${Xray_URL}Xray-linux-arm32-v6.zip && unzip -q Xray-linux-arm32-v6.zip && rm -f Xray-linux-arm32-v6.zip
          elif [ "${{ matrix.platform }}" == "linux-386" ]; then
            curl -sSL -O ${Xray_URL}Xray-linux-32.zip && unzip -q Xray-linux-32.zip && rm -f Xray-linux-32.zip
          elif [ "${{ matrix.platform }}" == "linux-armv5" ]; then
            curl -sSL -O ${Xray_URL}Xray-linux-arm32-v5.zip && unzip -q Xray-linux-arm32-v5.zip && rm -f Xray-linux-arm32-v5.zip
          elif [ "${{ matrix.platform }}" == "linux-s390x" ]; then
            curl -sSL -O ${Xray_URL}Xray-linux-s390x.zip && unzip -q Xray-linux-s390x.zip && rm -f Xray-linux-s390x.zip
          elif [ "${{ matrix.platform }}" == "darwin-amd64" ]; then
            curl -sSL -O ${Xray_URL}Xray-macos-64.zip && unzip -q Xray-macos-64.zip && rm -f Xray-macos-64.zip
          elif [ "${{ matrix.platform }}" == "darwin-arm64" ]; then
            curl -sSL -O ${Xray_URL}Xray-macos-arm64-v8a.zip && unzip -q Xray-macos-arm64-v8a.zip && rm -f Xray-macos-arm64-v8a.zip
          elif [ "${{ matrix.platform }}" == "linux-riscv64" ]; then
            curl -sSL -O ${Xray_URL}Xray-linux-riscv64.zip && unzip -q Xray-linux-riscv64.zip && rm -f Xray-linux-riscv64.zip || true
          elif [ "${{ matrix.platform }}" == "linux-mips" ]; then
            curl -sSL -O ${Xray_URL}Xray-linux-mips32.zip && unzip -q Xray-linux-mips32.zip && rm -f Xray-linux-mips32.zip || true
          elif [ "${{ matrix.platform }}" == "linux-mipsle" ]; then
            curl -sSL -O ${Xray_URL}Xray-linux-mips32le.zip && unzip -q Xray-linux-mips32le.zip && rm -f Xray-linux-mips32le.zip || true
          elif [ "${{ matrix.platform }}" == "linux-mips64" ]; then
            curl -sSL -O ${Xray_URL}Xray-linux-mips64.zip && unzip -q Xray-linux-mips64.zip && rm -f Xray-linux-mips64.zip || true
          elif [ "${{ matrix.platform }}" == "linux-mips64le" ]; then
            curl -sSL -O ${Xray_URL}Xray-linux-mips64le.zip && unzip -q Xray-linux-mips64le.zip && rm -f Xray-linux-mips64le.zip || true
          elif [ "${{ matrix.platform }}" == "linux-ppc64le" ]; then
            curl -sSL -O ${Xray_URL}Xray-linux-ppc64le.zip && unzip -q Xray-linux-ppc64le.zip && rm -f Xray-linux-ppc64le.zip || true
          elif [ "${{ matrix.platform }}" == "linux-loong64" ]; then
            curl -sSL -O ${Xray_URL}Xray-linux-loong64.zip && unzip -q Xray-linux-loong64.zip && rm -f Xray-linux-loong64.zip || true
          elif [ "${{ matrix.platform }}" == "freebsd-amd64" ]; then
            curl -sSL -O ${Xray_URL}Xray-freebsd-64.zip && unzip -q Xray-freebsd-64.zip && rm -f Xray-freebsd-64.zip || true
          elif [ "${{ matrix.platform }}" == "freebsd-arm64" ]; then
            curl -sSL -O ${Xray_URL}Xray-freebsd-arm64-v8a.zip && unzip -q Xray-freebsd-arm64-v8a.zip && rm -f Xray-freebsd-arm64-v8a.zip || true
          elif [ "${{ matrix.platform }}" == "freebsd-386" ]; then
            curl -sSL -O ${Xray_URL}Xray-freebsd-32.zip && unzip -q Xray-freebsd-32.zip && rm -f Xray-freebsd-32.zip || true
          fi

          rm -f geoip.dat geosite.dat
          curl -sSL -O https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -sSL -O https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          GEO_TAG=$(curl -sSL -I "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest" | grep -i "^location:" | sed -E 's/.*tag\/([^[:space:]\r\n]+).*/\1/')
          if [ -z "$GEO_TAG" ]; then
            GEO_TAG=$(curl -sSL https://api.github.com/repos/Loyalsoldier/v2ray-rules-dat/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          if [ -n "$GEO_TAG" ]; then
            echo "$GEO_TAG" > geoip.dat.version
            echo "$GEO_TAG" > geosite.dat.version
          fi
          curl -sSL -o geoip_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat
          curl -sSL -o geosite_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat
          curl -sSL -o geoip_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -sSL -o geosite_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat

          if [ "${{ runner.os }}" == "macOS" ]; then
            if [ "${{ matrix.platform }}" == "darwin-amd64" ]; then
              mv xray xray-darwin-amd64 2>/dev/null || true
            elif [ "${{ matrix.platform }}" == "darwin-arm64" ]; then
              mv xray xray-darwin-arm64 2>/dev/null || true
            fi
          else
            mv xray xray-${{ matrix.platform }} 2>/dev/null || true
          fi

          MTG_URL="https://github.com/mhsanaei/mtg-multi/releases/download/v1.16.0/"
          if [ "${{ matrix.platform }}" == "linux-amd64" ] || [ "${{ matrix.platform }}" == "linux-arm64" ] || [ "${{ matrix.platform }}" == "linux-armv7" ] || [ "${{ matrix.platform }}" == "linux-armv6" ] || [ "${{ matrix.platform }}" == "linux-386" ] || [ "${{ matrix.platform }}" == "linux-armv5" ] || [ "${{ matrix.platform }}" == "linux-s390x" ]; then
            curl -sSL -O "${MTG_URL}mtg-multi-1.16.0-${{ matrix.platform }}.tar.gz" && \
            tar -xzf "mtg-multi-1.16.0-${{ matrix.platform }}.tar.gz" && \
            rm -f "mtg-multi-1.16.0-${{ matrix.platform }}.tar.gz" && \
            mv mtg-multi-1.16.0-${{ matrix.platform }}/mtg-multi "mtg-${{ matrix.platform }}" 2>/dev/null || true
            rm -rf "mtg-multi-1.16.0-${{ matrix.platform }}"
          fi
          cd ../..

      - name: Build x-ui (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CGO_ENABLED="0"
          $env:GOOS="windows"
          if ("${{ matrix.platform }}" -eq "windows-386") {
            $env:GOARCH="386"
            $archName="386"
            $xrayZip="Xray-windows-32.zip"
          } elseif ("${{ matrix.platform }}" -eq "windows-arm64") {
            $env:GOARCH="arm64"
            $archName="arm64"
            $xrayZip="Xray-windows-arm64-v8a.zip"
          } else {
            $env:GOARCH="amd64"
            $archName="amd64"
            $xrayZip="Xray-windows-64.zip"
          }
          go build -mod=readonly -ldflags "-w -s" -o xui-release.exe -v main.go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          mkdir x-ui
          Copy-Item xui-release.exe x-ui\
          mkdir x-ui\bin
          cd x-ui\bin

          # Download Xray for Windows
          $Xray_URL = "https://github.com/XTLS/Xray-core/releases/download/v26.11.9/"
          Invoke-WebRequest -Uri "${Xray_URL}${xrayZip}" -OutFile "${xrayZip}"
          Expand-Archive -Path "${xrayZip}" -DestinationPath .
          Remove-Item "${xrayZip}"
          Remove-Item geoip.dat, geosite.dat -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat" -OutFile "geoip.dat"
          Invoke-WebRequest -Uri "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat" -OutFile "geosite.dat"
          try {
            $resp = Invoke-WebRequest -Uri "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest" -MaximumRedirection 0 -ErrorAction SilentlyContinue
            $geoTag = $resp.Headers.Location -replace '.*/tag/', ''
            if ($geoTag) {
              Set-Content -Path "geoip.dat.version" -Value $geoTag -NoNewline
              Set-Content -Path "geosite.dat.version" -Value $geoTag -NoNewline
            }
          } catch {}
          Invoke-WebRequest -Uri "https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat" -OutFile "geoip_IR.dat"
          Invoke-WebRequest -Uri "https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat" -OutFile "geosite_IR.dat"
          Invoke-WebRequest -Uri "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat" -OutFile "geoip_RU.dat"
          Invoke-WebRequest -Uri "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat" -OutFile "geosite_RU.dat"
          Rename-Item xray.exe "xray-windows-${archName}.exe" -ErrorAction SilentlyContinue

          # Download mtg-multi for Windows
          $MTG_URL = "https://github.com/mhsanaei/mtg-multi/releases/download/v1.16.0/"
          $mtgZip = "mtg-multi-1.16.0-windows-${archName}.zip"
          try {
            Invoke-WebRequest -Uri "${MTG_URL}${mtgZip}" -OutFile "${mtgZip}"
            Expand-Archive -Path "${mtgZip}" -DestinationPath .
            Remove-Item "${mtgZip}" -ErrorAction SilentlyContinue
            Move-Item "mtg-multi-1.16.0-windows-${archName}\mtg-multi.exe" "mtg-windows-${archName}.exe" -Force -ErrorAction SilentlyContinue
            Remove-Item "mtg-multi-1.16.0-windows-${archName}" -Recurse -Force -ErrorAction SilentlyContinue
          } catch {}
          cd ../..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path x-ui -DestinationPath "x-ui-${{ matrix.platform }}.zip"

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          tar -zcvf x-ui-${{ matrix.platform }}.tar.gz x-ui

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: x-ui-${{ matrix.platform }}
          path: |
            x-ui-${{ matrix.platform }}.zip
            x-ui-${{ matrix.platform }}.tar.gz

      - name: Upload files to GH release (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file: x-ui-${{ matrix.platform }}.zip
          asset_name: x-ui-${{ matrix.platform }}.zip
          prerelease: true

      - name: Upload files to GH release (Linux / macOS)
        if: runner.os != 'Windows' && startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file: x-ui-${{ matrix.platform }}.tar.gz
          asset_name: x-ui-${{ matrix.platform }}.tar.gz
          prerelease: true